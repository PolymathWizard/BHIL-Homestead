<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOMESTEAD figure kit</title>
<style>
body { margin: 0; background: #0D1B2E; color: #FFFFFF; font-family: 'IBM Plex Sans', Arial, Helvetica, sans-serif; }
header, main { max-width: 1440px; margin: 0 auto; padding: 0 40px; }
header { padding-top: 48px; border-bottom: 1px solid #1E3A5F; padding-bottom: 24px; }
.eyebrow { font-family: 'IBM Plex Mono', 'Courier New', Courier, monospace; letter-spacing: 0.22em; font-size: 12px; color: #6CC0E8; text-transform: uppercase; }
h1 { font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 48px; margin: 12px 0 4px; }
.dek { font-family: Newsreader, Georgia, 'Times New Roman', serif; font-style: italic; opacity: 0.75; font-size: 20px; margin: 0; }
figure { margin: 40px 0; }
img { width: 100%; height: auto; display: block; border: 1px solid #1E3A5F; }
figcaption { font-size: 15px; margin-top: 10px; opacity: 0.9; }
figcaption span { font-family: 'IBM Plex Mono', 'Courier New', Courier, monospace; letter-spacing: 0.2em; color: #6CC0E8; }
small { opacity: 0.6; }
</style>
</head>
<body>
<header>
<div class="eyebrow">Barry Hurd Intelligence Lab · HOMESTEAD figure kit</div>
<h1>Ten figures, one frame.</h1>
<p class="dek">Period web specimens inside the BHIL instrument frame. Animations stop when your system prefers reduced motion.</p>
</header>
<main>
<figure><img src="hs-01-masthead.svg" alt="HOMESTEAD masthead: a dot-matrix HOMESTEAD wordmark over the BHIL dot constellation, with period badges for presets B, C, and E and Safe Mode." width="1600" height="900" loading="eager"><figcaption><span>HS-01</span> Retro-Web Redesign Engine<br><small>Stars in the dot constellation twinkle slowly; the dot-matrix cursor blinks once per second.</small></figcaption></figure>
<figure><img src="hs-02-era-neighborhoods.svg" alt="Timeline from 1993 to 2026 showing the six HOMESTEAD era presets, with kits for GeoCities, FrontPage, and MySpace." width="1600" height="900" loading="eager"><figcaption><span>HS-02</span> Six neighborhoods. One address per build.<br><small>A highlight frame visits one era at a time, every two seconds.</small></figcaption></figure>
<figure><img src="hs-03-pipeline.svg" alt="BHIL ASCII pipeline on an ink panel: intake, survey, era lock, map, assets, build, and audit, with owners, outputs, and the revise loop." width="1600" height="900" loading="eager"><figcaption><span>HS-03</span> Seven phases. Every one leaves paper.<br><small>A block cursor steps through the seven phases, two seconds each.</small></figcaption></figure>
<figure><img src="hs-04-site-survey.svg" alt="A modern page being scanned into an inventory window listing detected patterns, brand colors with web-safe snaps, fonts, and tone." width="1600" height="900" loading="eager"><figcaption><span>HS-04</span> Inventory before era.<br><small>A scan line sweeps down the modern page every four seconds.</small></figcaption></figure>
<figure><img src="hs-05-component-mapping.svg" alt="Table mapping six modern patterns to their GeoCities, FrontPage, and MySpace equivalents, each with a period badge." width="1600" height="900" loading="eager"><figcaption><span>HS-05</span> Translate component by component.<br><small>A highlight frame steps down the six rows.</small></figcaption></figure>
<figure><img src="hs-06-asset-smithy.svg" alt="The 216-color web-safe cube with BHIL brand colors snapped to it, beside real gifsmith outputs: a badge, a construction sign, odometer digits, nav buttons, glitter text, and the pixel font." width="1600" height="900" loading="eager"><figcaption><span>HS-06</span> Every glyph drawn here. Nothing borrowed.<br><small>The construction sign and glitter specimens play their real frames at 600 ms and 400 ms.</small></figcaption></figure>
<figure><img src="hs-07-view-source.svg" alt="A period source window with a web font, rounded corners, and modern copy flagged by the HOMESTEAD era lint, beside the lint report." width="1600" height="900" loading="eager"><figcaption><span>HS-07</span> View Source never lies.<br><small>Flagged lines pulse copper; the editor cursor blinks.</small></figcaption></figure>
<figure><img src="hs-08-safe-mode.svg" alt="The same period page as built, with starfield, marquee, and blinking badge, and in Safe Mode as plain black text on white." width="1600" height="900" loading="eager"><figcaption><span>HS-08</span> Keep the chaos. Give it an off switch.<br><small>Only the as-built side moves: twinkling stars, a slow marquee, and a once-per-second NEW badge.</small></figcaption></figure>
<figure><img src="hs-09-rubric.svg" alt="Odometer showing 39 of 40 for the Nimbus Ledger 1998 build, the twenty rubric rows with their scores, the score bands, and the hard gates." width="1600" height="900" loading="eager"><figcaption><span>HS-09</span> Graded blind. Scored to forty.<br><small>The SHIP stamp breathes slowly.</small></figcaption></figure>
<figure><img src="hs-10-agent-crew.svg" alt="Profile-style friend grid of the human director, the orchestrator, and six subagents with their tools, the auditor marked read only." width="1600" height="900" loading="eager"><figcaption><span>HS-10</span> The crew's Top 8. One of them can't write.<br><small>The orchestrator's ONLINE NOW badge blinks once per second.</small></figcaption></figure>
</main>
</body>
</html>
