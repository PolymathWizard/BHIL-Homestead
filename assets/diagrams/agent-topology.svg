<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">HOMESTEAD agent topology</title>
<desc id="d">One orchestrator over six tool-isolated subagents. The auditor has no write tools.</desc>
<rect width="1200" height="420" fill="#FFFFFF"/>
<text x="32" y="40" font-family="IBM Plex Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#1C1C2E">CADRE topology: orchestrator over tool-isolated subagents</text>
